[project]
name = "moneygraph"
version = "1.0.0"
description = "Граф денег: восстановление финансовой структуры организованной группы"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.scripts]
moneygraph = "moneygraph.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneygraph"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
