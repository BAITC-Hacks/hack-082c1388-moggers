[project]
name = "moneygraph"
version = "1.0.0"
description = "Граф денег: восстановление финансовой структуры организованной группы"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "networkx>=3.1",
    "numpy>=1.24",
    "scipy>=1.11",
]

[project.optional-dependencies]
# Ассистент опционален: пайплайн и выгрузки считаются без него и без интернета.
assistant = ["openai>=1.54", "python-dotenv>=1.0"]
web = ["fastapi>=0.115", "uvicorn>=0.30", "openai>=1.54", "python-dotenv>=1.0"]

[project.scripts]
moneygraph = "moneygraph.pipeline:main"
moneygraph-ask = "moneygraph.cli:main"
moneygraph-serve = "moneygraph.serve:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneygraph"]
artifacts = ["src/moneygraph/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
